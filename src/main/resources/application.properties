spring.application.name=DifferentWorlds
server.port=8080

spring.datasource.url=jdbc:h2:mem:dbdemo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Token lifetime in milliseconds (432000000 = 5 days, 3600000 = 1 hour)
security.jwt.expiration-time=432000000
# Base64 key, at least 32 bytes. This fallback is a DEMO key only.
# For anything real, set the JWT_SECRET environment variable
# (generate one with: openssl rand -base64 48)
security.jwt.secret-key=${JWT_SECRET:rvr74L3a5+T57Cj6lUU7e9ObNzBYeurr31HOWr8snk471puAD+06gyj7QnGGsgw7}

app.admin.name=Admin
app.admin.username=admin
app.admin.email=admin@differentworlds.local
app.admin.password=${ADMIN_PASSWORD:ChangeMe123}

logging.level.org.springframework.security=INFO

custom.myApp.name=Different Worlds
custom.myApp.version=1.0.0


